[project]
name = "homerunner"
version = "0.1.0"
description = "Run your private repositories' CI on a machine you already own, with one command per repository and a refusal to do the dangerous thing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yauhen Bichel" }]
requires-python = ">=3.10"
keywords = ["github-actions", "self-hosted-runner", "ci", "homelab", "private-repository"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = []          # the standard library, plus the gh CLI you already have

[project.scripts]
homerunner = "homerunner.cli:main"

[project.urls]
Homepage = "https://github.com/YauhenBichel/homerunner"
Issues = "https://github.com/YauhenBichel/homerunner/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homerunner"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
